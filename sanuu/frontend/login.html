<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Residency Issue Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🏠 Residency Issue Tracker
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to manage and track your residency issues.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot_password">

                    <a href="forgot_password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Register Here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Residency Issue Tracker.
            All Rights Reserved.
        </p>

    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
