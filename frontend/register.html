<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Residency Issue Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🏠 Residency Issue Tracker
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Register as a resident to report and track your issues.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select Role
                        </option>

                        <option value="resident">
                            Resident
                        </option>

                        <option value="staff">
                            Staff
                        </option>

                        <option value="Admin">
                            Admin
                        </option>


                    </select>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login Here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Residency Issue Tracker.
            All Rights Reserved.
        </p>

    </footer>

<script src="js/auth.js"></script>

    </body>
</html>
